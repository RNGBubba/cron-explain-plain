[project]
name = "cron-explain"
version = "0.1.0"
description = "A dependency-free CLI that explains standard five-field cron expressions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cron-explain = "cron_explain.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cron_explain"]
